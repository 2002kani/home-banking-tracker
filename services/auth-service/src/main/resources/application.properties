spring.application.name=auth-service
server.port=8083

#persistence
spring.datasource.url=jdbc:postgresql://localhost:5433/auth_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.refresh-token-expiration=604800

#Clients (Service-Root, die internen Endpunkte liegen nicht unter /api/v1)
transaction-service.base-url=http://localhost:8080
account-service.base-url=http://localhost:8081
open-banking-service.base-url=http://localhost:8082

#Secrets
spring.config.import=optional:classpath:keys/secrets.properties